<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gramainst · Feed</title>
  <!-- A showcase screen of XRAY/DESIGN: plain HTML on the kit's own CSS and controllers. -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="../app.js"></script>
</head>
<body>
  <header class="app-bar">
    <span class="app-title" data-brand>Gramainst</span>
    <button class="x-icon-button" type="button" aria-label="Activity"><svg class="x-icon" data-icon="heart"></svg></button>
    <button class="x-icon-button" type="button" aria-label="Messages"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
  </header>
  <main class="app-screen" data-flush>
    <ul class="app-stories" aria-label="Stories">
      <li><span class="app-ring"><span class="x-avatar" data-seed="you" data-palette="amber" aria-hidden="true"></span></span><span>You</span></li>
      <li><span class="app-ring"><span class="x-avatar" data-seed="mira" data-palette="cool" aria-hidden="true"></span></span><span>mira</span></li>
      <li><span class="app-ring"><span class="x-avatar" data-seed="tomas" data-palette="ember" aria-hidden="true"></span></span><span>tomas</span></li>
      <li><span class="app-ring"><span class="x-avatar" data-seed="studio" data-palette="xray" aria-hidden="true"></span></span><span>studio</span></li>
      <li data-seen><span class="app-ring"><span class="x-avatar" data-seed="lena" data-palette="blue" aria-hidden="true"></span></span><span>lena</span></li>
      <li data-seen><span class="app-ring"><span class="x-avatar" data-seed="kai" data-palette="amber" aria-hidden="true"></span></span><span>kai</span></li>
    </ul>
    <div class="app-pad">
    <article class="x-post" aria-labelledby="p1">
      <header class="x-post-head">
        <span class="x-post-lead"><span class="x-avatar" data-seed="mira" data-palette="cool" aria-hidden="true"></span></span>
        <div class="x-post-author" id="p1"><span class="x-post-name">mira</span><span class="x-post-meta">Lisbon · 2h</span></div>
        <button class="x-icon-button" type="button" data-size="sm" aria-label="More"><svg class="x-icon" data-icon="ellipsis-horizontal"></svg></button>
      </header>
      <p class="x-post-text">Morning light on the tiles.</p>
      <div class="x-post-media" data-ratio="portrait"><span class="app-art" data-art="mira-1" data-palette="cool" role="img" aria-label="Abstract picture" style="height:100%"></span></div>
      <footer class="x-post-actions">
        <button class="x-post-action" type="button" data-action="like" aria-pressed="true" aria-label="Like, 248"><svg class="x-icon" data-icon="heart"></svg><span>248</span></button>
        <button class="x-post-action" type="button" data-action="reply" aria-label="Reply, 12"><svg class="x-icon" data-icon="chat-bubble-oval-left"></svg><span>12</span></button>
        <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
      </footer>
    </article>
    <article class="x-post" aria-labelledby="p2">
      <header class="x-post-head">
        <span class="x-post-lead"><span class="x-avatar" data-seed="studio" data-palette="xray" aria-hidden="true"></span></span>
        <div class="x-post-author" id="p2"><span class="x-post-name">studio</span><span class="x-post-meta">Sponsored · 5h</span></div>
        <button class="x-icon-button" type="button" data-size="sm" aria-label="More"><svg class="x-icon" data-icon="ellipsis-horizontal"></svg></button>
      </header>
      <div class="x-post-media" data-ratio="square"><span class="app-art" data-art="studio-7" data-palette="xray" role="img" aria-label="Abstract picture" style="height:100%"></span></div>
      <footer class="x-post-actions">
        <button class="x-post-action" type="button" data-action="like" aria-pressed="false" aria-label="Like, 1024"><svg class="x-icon" data-icon="heart"></svg><span>1024</span></button>
        <button class="x-post-action" type="button" data-action="reply" aria-label="Reply, 86"><svg class="x-icon" data-icon="chat-bubble-oval-left"></svg><span>86</span></button>
        <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
      </footer>
    </article>
    <article class="x-post" aria-labelledby="p3">
      <header class="x-post-head">
        <span class="x-post-lead"><span class="x-avatar" data-seed="tomas" data-palette="ember" aria-hidden="true"></span></span>
        <div class="x-post-author" id="p3"><span class="x-post-name">tomas</span><span class="x-post-meta">Porto · Yesterday</span></div>
        <button class="x-icon-button" type="button" data-size="sm" aria-label="More"><svg class="x-icon" data-icon="ellipsis-horizontal"></svg></button>
      </header>
      <p class="x-post-text">The bridge at dusk.</p>
      <div class="x-post-media"><span class="app-art" data-art="tomas-3" data-palette="ember" role="img" aria-label="Abstract picture" style="height:100%"></span></div>
      <footer class="x-post-actions">
        <button class="x-post-action" type="button" data-action="like" aria-pressed="false" aria-label="Like, 73"><svg class="x-icon" data-icon="heart"></svg><span>73</span></button>
        <button class="x-post-action" type="button" data-action="reply" aria-label="Reply, 4"><svg class="x-icon" data-icon="chat-bubble-oval-left"></svg><span>4</span></button>
        <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
      </footer>
    </article>
    </div>
  </main>
  <footer class="app-tabs">
    <nav class="x-liquid-indicator" aria-label="Gramainst" data-width="full" data-layout="stack">
      <a class="x-liquid-indicator-item" href="feed.html" aria-current="page"><svg class="x-icon" data-icon="home"></svg><span>Feed</span></a>
      <a class="x-liquid-indicator-item" href="explore.html"><svg class="x-icon" data-icon="magnifying-glass"></svg><span>Explore</span></a>
      <a class="x-liquid-indicator-item" href="profile.html"><svg class="x-icon" data-icon="user"></svg><span>Profile</span></a>
      <span class="x-liquid-indicator-pill" aria-hidden="true"></span>
    </nav>
  </footer>
</body>
</html>
