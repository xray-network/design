<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gramainst · Profile</title>
  <!-- A showcase screen of XRAY/DESIGN: plain HTML on the kit's own CSS and controllers. -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="../app.js"></script>
</head>
<body>
  <header class="app-bar">
    <span class="app-title">mira</span>
    <button class="x-icon-button" type="button" aria-label="New post"><svg class="x-icon" data-icon="plus"></svg></button>
    <button class="x-icon-button" type="button" aria-label="Menu"><svg class="x-icon" data-icon="bars-3"></svg></button>
  </header>
  <main class="app-screen" data-flush>
    <div class="app-pad">
    <section class="x-profile" aria-labelledby="who" style="padding-top: var(--x-space-4)">
      <div class="x-profile-top">
        <span class="x-profile-lead"><span class="x-avatar" data-size="lg" data-seed="mira" data-palette="cool" aria-hidden="true"></span></span>
        <dl class="x-profile-stats"><div><dd>128</dd><dt>Posts</dt></div><div><dd>12.4K</dd><dt>Followers</dt></div><div><dd>312</dd><dt>Following</dt></div></dl>
      </div>
      <div class="x-profile-id"><h2 class="x-profile-name" id="who">Mira Lindqvist</h2><span class="x-profile-handle">@mira</span></div>
      <p class="x-profile-bio">Photographer in Lisbon. Tiles, light and quiet streets.</p>
      <div class="x-profile-actions"><button class="x-button" type="button">Follow</button><button class="x-button" type="button" data-variant="ghost">Message</button></div>
    </section>
    </div>
    <div class="x-segmented" role="radiogroup" aria-label="View" data-width="full" data-size="sm" style="margin:var(--x-space-4)">
      <label class="x-segmented-item"><input type="radio" name="view" checked><span>Posts</span></label>
      <label class="x-segmented-item"><input type="radio" name="view"><span>Saved</span></label>
      <label class="x-segmented-item"><input type="radio" name="view"><span>Tagged</span></label>
    </div>
    <div class="app-grid"><span class="app-art" data-art="mira-0" data-palette="cool" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-1" data-palette="blue" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-2" data-palette="cool" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-3" data-palette="amber" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-4" data-palette="cool" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-5" data-palette="xray" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-6" data-palette="blue" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-7" data-palette="cool" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-8" data-palette="ember" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-9" data-palette="cool" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-10" data-palette="blue" role="img" aria-label="Abstract picture"></span><span class="app-art" data-art="mira-11" data-palette="amber" role="img" aria-label="Abstract picture"></span></div>
  </main>
  <footer class="app-tabs">
    <nav class="x-liquid-indicator" aria-label="Gramainst" data-width="full" data-layout="stack">
      <a class="x-liquid-indicator-item" href="feed.html"><svg class="x-icon" data-icon="home"></svg><span>Feed</span></a>
      <a class="x-liquid-indicator-item" href="explore.html"><svg class="x-icon" data-icon="magnifying-glass"></svg><span>Explore</span></a>
      <a class="x-liquid-indicator-item" href="profile.html" aria-current="page"><svg class="x-icon" data-icon="user"></svg><span>Profile</span></a>
      <span class="x-liquid-indicator-pill" aria-hidden="true"></span>
    </nav>
  </footer>
</body>
</html>
