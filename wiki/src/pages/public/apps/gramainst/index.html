<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gramainst</title>
  <!-- A showcase app of XRAY/Design: plain HTML on the kit's own CSS and controllers. One file: every screen is
       a section, shown by the hash (index.html#feed); ../app.js moves between them with the kit's Screen pattern. -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="../app.js"></script>
</head>
<body data-form="mobile">
  <div class="app-shell">
    <div class="x-screens app-views">
      <section class="x-screen app-view" data-screen="feed" aria-label="Feed" tabindex="-1">
    <header class="app-bar">
        <span class="app-title" data-brand>Gramainst</span>
        <button class="x-icon-button" type="button" aria-label="Activity"><svg class="x-icon" data-icon="heart"></svg></button>
        <button class="x-icon-button" type="button" aria-label="Messages"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
      </header>
      <main class="app-screen" data-flush>
        <ul class="x-stories" aria-label="Stories">
          <li><button class="x-stories-item" type="button"><span class="x-stories-ring"><span class="x-avatar" data-seed="you" data-palette="amber" aria-hidden="true"></span></span><span class="x-stories-name">You</span></button></li>
          <li><button class="x-stories-item" type="button"><span class="x-stories-ring"><span class="x-avatar" data-seed="mira" data-palette="cool" aria-hidden="true"></span></span><span class="x-stories-name">mira</span></button></li>
          <li><button class="x-stories-item" type="button"><span class="x-stories-ring"><span class="x-avatar" data-seed="tomas" data-palette="ember" aria-hidden="true"></span></span><span class="x-stories-name">tomas</span></button></li>
          <li><button class="x-stories-item" type="button"><span class="x-stories-ring"><span class="x-avatar" data-seed="studio" data-palette="xray" aria-hidden="true"></span></span><span class="x-stories-name">studio</span></button></li>
          <li><button class="x-stories-item" type="button" data-seen=""><span class="x-stories-ring"><span class="x-avatar" data-seed="lena" data-palette="blue" aria-hidden="true"></span></span><span class="x-stories-name">lena</span></button></li>
          <li><button class="x-stories-item" type="button" data-seen=""><span class="x-stories-ring"><span class="x-avatar" data-seed="kai" data-palette="amber" aria-hidden="true"></span></span><span class="x-stories-name">kai</span></button></li>
        </ul>
        <div class="app-pad">
        <article class="x-post" aria-labelledby="p1">

            <span class="x-post-lead"><span class="x-avatar" data-seed="mira" data-palette="cool" aria-hidden="true"></span></span>
            <div class="x-post-author" id="p1"><span class="x-post-name">mira</span><span class="x-post-meta">Lisbon · 2h</span></div>
            <button class="x-icon-button" type="button" data-size="sm" aria-label="More"><svg class="x-icon" data-icon="ellipsis-horizontal"></svg></button>
          </header>
          <p class="x-post-text">Morning light on the tiles.</p>
          <div class="x-post-media" data-ratio="portrait"><span class="app-art" data-art="mira-1" data-palette="cool" role="img" aria-label="Picture" style="height:100%"></span></div>
          <footer class="x-post-actions">
            <button class="x-post-action" type="button" data-action="like" aria-pressed="true" aria-label="Like, 248"><svg class="x-icon" data-icon="heart"></svg><span>248</span></button>
            <button class="x-post-action" type="button" data-action="reply" aria-label="Reply, 12"><svg class="x-icon" data-icon="chat-bubble-oval-left"></svg><span>12</span></button>
            <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
          </footer>
        </article>
        <article class="x-post" aria-labelledby="p2">
          <header class="x-post-head">
            <span class="x-post-lead"><span class="x-avatar" data-seed="studio" data-palette="xray" aria-hidden="true"></span></span>

            <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
          </footer>
        </article>
        <article class="x-post" aria-labelledby="p3">
          <header class="x-post-head">
            <span class="x-post-lead"><span class="x-avatar" data-seed="tomas" data-palette="ember" aria-hidden="true"></span></span>
            <div class="x-post-author" id="p3"><span class="x-post-name">tomas</span><span class="x-post-meta">Porto · Yesterday</span></div>
            <button class="x-icon-button" type="button" data-size="sm" aria-label="More"><svg class="x-icon" data-icon="ellipsis-horizontal"></svg></button>
          </header>
          <p class="x-post-text">The bridge at dusk.</p>
          <div class="x-post-media"><span class="app-art" data-art="tomas-3" data-palette="ember" role="img" aria-label="Picture" style="height:100%"></span></div>
          <footer class="x-post-actions">
            <button class="x-post-action" type="button" data-action="like" aria-pressed="false" aria-label="Like, 73"><svg class="x-icon" data-icon="heart"></svg><span>73</span></button>
            <button class="x-post-action" type="button" data-action="reply" aria-label="Reply, 4"><svg class="x-icon" data-icon="chat-bubble-oval-left"></svg><span>4</span></button>
            <button class="x-post-action" type="button" data-action="share" data-end="" aria-label="Share"><svg class="x-icon" data-icon="paper-airplane"></svg></button>
          </footer>
        </article>
        </div>
      </main>
      </section>

      </main>
      </section>
      <section class="x-screen app-view" data-screen="profile" aria-label="Profile" tabindex="-1" hidden>
    <header class="app-bar">
        <span class="app-title">mira</span>
        <button class="x-icon-button" type="button" aria-label="New post"><svg class="x-icon" data-icon="plus"></svg></button>
        <button class="x-icon-button" type="button" aria-label="Menu"><svg class="x-icon" data-icon="bars-3"></svg></button>
      </header>

          <div class="x-profile-actions"><button class="x-button" type="button">Follow</button><button class="x-button" type="button" data-variant="ghost">Message</button></div>
        </section>
        </div>

      </main>
      </section>
    </div>
  <footer class="x-tab-bar">
      <nav class="x-liquid-indicator" aria-label="Gramainst" data-width="full" data-layout="stack">
