<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nancbin · Wallet</title>
  <!-- A showcase screen of XRAY/DESIGN: plain HTML on the kit's own CSS and controllers. -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="../app.js"></script>
</head>
<body>
  <header class="app-bar"><span class="app-title">Wallet</span><button class="x-icon-button" type="button" aria-label="Hide balances"><svg class="x-icon" data-icon="eye-slash"></svg></button><button class="x-icon-button" type="button" aria-label="History"><svg class="x-icon" data-icon="clock"></svg></button></header>
  <main class="app-screen">
    <section class="x-balance" aria-label="Total balance">
      <div class="x-balance-label">Total balance</div>
      <span class="x-numeral" data-size="hero"><span class="x-numeral-value">14,488<span class="x-numeral-frac">.40</span></span><span class="x-numeral-ticker">USD</span></span>
      <div class="x-balance-meta"><span class="x-delta" data-trend="up">+1.9%</span><span class="x-balance-period">today</span></div>
      <div class="x-balance-actions">
        <button class="x-button" type="button">Deposit</button>
        <button class="x-button" type="button" data-variant="ghost">Withdraw</button>
        <button class="x-button" type="button" data-variant="ghost">Transfer</button>
      </div>
    </section>
    <section>
      <h2 class="app-heading">Assets</h2>
      <div class="x-list x-stagger" role="list" aria-label="Assets">
      <a class="x-list-row" role="listitem" href="trade.html">
        <span class="x-list-token" style="--x-list-token-bg: var(--x-bg-active); color: var(--x-fg-1)" aria-hidden="true">B</span>
        <span class="x-list-text"><span class="x-list-title">Bitcoin</span><span class="x-list-sub">0.0812 BTC</span></span>
        <span class="x-list-end"><span class="x-list-title">$7,828.66</span><span class="x-list-sub"><span class="x-delta" data-trend="up">+1.8%</span></span></span>
      </a>
      <a class="x-list-row" role="listitem" href="trade.html">
        <span class="x-list-token" style="--x-list-token-bg: var(--x-bg-active); color: var(--x-fg-1)" aria-hidden="true">E</span>
        <span class="x-list-text"><span class="x-list-title">Ethereum</span><span class="x-list-sub">1.2400 ETH</span></span>
        <span class="x-list-end"><span class="x-list-title">$3,978.42</span><span class="x-list-sub"><span class="x-delta" data-trend="up">+2.4%</span></span></span>
      </a>
      <a class="x-list-row" role="listitem" href="trade.html">
        <span class="x-list-token" style="--x-list-token-bg: var(--x-bg-active); color: var(--x-fg-1)" aria-hidden="true">U</span>
        <span class="x-list-text"><span class="x-list-title">USD Coin</span><span class="x-list-sub">1,200.00 USDC</span></span>
        <span class="x-list-end"><span class="x-list-title">$1,200.00</span><span class="x-list-sub"><span class="x-delta" data-trend="up">+0.0%</span></span></span>
      </a>
      <a class="x-list-row" role="listitem" href="trade.html">
        <span class="x-list-token" style="--x-list-token-bg: var(--x-bg-active); color: var(--x-fg-1)" aria-hidden="true">S</span>
        <span class="x-list-text"><span class="x-list-title">Solana</span><span class="x-list-sub">4.5000 SOL</span></span>
        <span class="x-list-end"><span class="x-list-title">$843.89</span><span class="x-list-sub"><span class="x-delta" data-trend="down">−0.9%</span></span></span>
      </a>
      <a class="x-list-row" role="listitem" href="trade.html">
        <span class="x-list-token" style="--x-list-token-bg: var(--x-bg-active); color: var(--x-fg-1)" aria-hidden="true">A</span>
        <span class="x-list-text"><span class="x-list-title">Cardano</span><span class="x-list-sub">860.00 ADA</span></span>
        <span class="x-list-end"><span class="x-list-title">$637.43</span><span class="x-list-sub"><span class="x-delta" data-trend="up">+4.1%</span></span></span>
      </a>
      </div>
    </section>
  </main>
  <footer class="app-tabs">
    <nav class="x-liquid-indicator" aria-label="Nancbin" data-width="full" data-layout="stack">
      <a class="x-liquid-indicator-item" href="markets.html"><svg class="x-icon" data-icon="chart-bar"></svg><span>Markets</span></a>
      <a class="x-liquid-indicator-item" href="trade.html"><svg class="x-icon" data-icon="arrows-right-left"></svg><span>Trade</span></a>
      <a class="x-liquid-indicator-item" href="wallet.html" aria-current="page"><svg class="x-icon" data-icon="wallet"></svg><span>Wallet</span></a>
      <span class="x-liquid-indicator-pill" aria-hidden="true"></span>
    </nav>
  </footer>
</body>
</html>
