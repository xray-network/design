<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nancbin · ETH</title>
  <!-- A showcase screen of XRAY/DESIGN: plain HTML on the kit's own CSS and controllers. -->
  <link rel="stylesheet" href="../kit.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="../app.js"></script>
</head>
<body>
  <header class="app-bar">
    <a class="x-icon-button" href="markets.html" aria-label="Back to markets"><svg class="x-icon" data-icon="chevron-left"></svg></a>
    <span class="app-title">ETH / USDC<small>Ethereum</small></span>
    <button class="x-icon-button" type="button" aria-label="Add to favorites"><svg class="x-icon" data-icon="star"></svg></button>
  </header>
  <main class="app-screen">
    <section>
      <p class="app-price"><span class="x-numeral" data-size="hero"><span class="x-numeral-value">3,208<span class="x-numeral-frac">.40</span></span><span class="x-numeral-ticker">USDC</span></span><span class="x-delta" data-trend="up">+2.4%</span></p>
      <svg class="app-spark" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Price up 2.4% over 24 hours"><path d="M0 78L25 72L50 80L75 61L100 66L125 48L150 55L175 40L200 44L225 28L250 33L275 18L300 22L300 100L0 100Z"/><path d="M0 78L25 72L50 80L75 61L100 66L125 48L150 55L175 40L200 44L225 28L250 33L275 18L300 22"/></svg>
      <div class="x-segmented" role="radiogroup" aria-label="Period" data-width="full" data-size="sm">
        <label class="x-segmented-item"><input type="radio" name="period"><span>1H</span></label>
        <label class="x-segmented-item"><input type="radio" name="period" checked><span>24H</span></label>
        <label class="x-segmented-item"><input type="radio" name="period"><span>7D</span></label>
        <label class="x-segmented-item"><input type="radio" name="period"><span>1M</span></label>
        <label class="x-segmented-item"><input type="radio" name="period"><span>1Y</span></label>
      </div>
    </section>
    <section>
      <form class="x-swap">
        <div class="x-swap-pair">
          <div class="x-amount" data-max="1200" data-decimals="2">
            <div class="x-amount-head"><label class="x-amount-label" for="pay">You pay</label><span class="x-amount-balance">Balance 1,200.00 <button class="x-button" type="button" data-variant="chip" data-x-max>Max</button></span></div>
            <div class="x-amount-main"><input class="x-amount-input" id="pay" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="500"><span class="x-amount-currency">USDC</span></div>
            <div class="x-amount-foot"><span class="x-amount-fiat">≈ $500.00</span></div>
          </div>
          <button class="x-icon-button x-swap-flip" type="button" aria-label="Switch currencies"><svg class="x-icon" data-icon="arrows-up-down"></svg></button>
          <div class="x-amount">
            <div class="x-amount-head"><label class="x-amount-label" for="get">You receive</label></div>
            <div class="x-amount-main"><input class="x-amount-input" id="get" type="text" inputmode="decimal" value="0.155374" readonly><span class="x-amount-currency">ETH</span></div>
            <div class="x-amount-foot"><span class="x-amount-fiat">≈ $498.50</span></div>
          </div>
        </div>
        <dl class="x-swap-details"><div><dt>Rate</dt><dd>1 ETH = 3,208.40 USDC</dd></div><div><dt>Fee</dt><dd>$1.50</dd></div></dl>
        <button class="x-button" type="submit" data-size="lg" data-width="full">Review order</button>
      </form>
    </section>
  </main>
  <footer class="app-tabs">
    <nav class="x-liquid-indicator" aria-label="Nancbin" data-width="full" data-layout="stack">
      <a class="x-liquid-indicator-item" href="markets.html"><svg class="x-icon" data-icon="chart-bar"></svg><span>Markets</span></a>
      <a class="x-liquid-indicator-item" href="trade.html" aria-current="page"><svg class="x-icon" data-icon="arrows-right-left"></svg><span>Trade</span></a>
      <a class="x-liquid-indicator-item" href="wallet.html"><svg class="x-icon" data-icon="wallet"></svg><span>Wallet</span></a>
      <span class="x-liquid-indicator-pill" aria-hidden="true"></span>
    </nav>
  </footer>
</body>
</html>
