<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Send Form</title>
    <link rel="stylesheet" href="style.css" />

</head>
<body>
    <div class="container">
        <h1>Send Cryptocurrency</h1>
        <form id="crypto-send-form" action="#" method="POST">
            <label for="from-address">From Address</label>
            <input type="text" id="from-address" name="fromAddress" placeholder="e.g. 0x1234…" required />

            <label for="to-address">To Address</label>
            <input type="text" id="to-address" name="toAddress" placeholder="e.g. 0xABCD…" required />

            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="any" min="0" placeholder="0.00" required />

            <label for="currency">Currency</label>
            <select id="currency" name="currency" required>
                <option value="ETH">Ethereum (ETH)</option>
                <option value="BTC">Bitcoin (BTC)</option>
                <option value="USDC">USD Coin (USDC)</option>
                <option value="DAI">Dai (DAI)</option>
            </select>

            <button type="submit">Send</button>
        </form>
    </div>
    <script>
        // Simple client‑side handler – replace with real API call in production
        document.getElementById('crypto-send-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                from: this.fromAddress.value,
                to: this.toAddress.value,
                amount: this.amount.value,
                currency: this.currency.value
            };
            console.log('Form data:', data);
            alert('Form submitted – check console for payload.');
            // TODO: integrate with backend / wallet SDK
        });
    </script>
</body>
</html>
