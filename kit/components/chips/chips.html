<!-- Filter chips, single choice: native radios. No JS. -->
<div class="x-chips" role="radiogroup" aria-label="Transaction type">
  <label class="x-chip"><input type="radio" name="tx" value="all" checked><span>All</span></label>
  <label class="x-chip"><input type="radio" name="tx" value="sent"><span>Sent<i>3</i></span></label>
  <label class="x-chip"><input type="radio" name="tx" value="received"><span>Received<i>2</i></span></label>
  <label class="x-chip"><input type="radio" name="tx" value="staking"><span>Staking<i>1</i></span></label>
  <label class="x-chip"><input type="radio" name="tx" value="tokens" disabled><span>Tokens</span></label>
</div>

<!-- Any number on: checkboxes -->
<div class="x-chips" role="group" aria-label="Chains">
  <label class="x-chip"><input type="checkbox" name="chain" value="cardano" checked><span>Cardano</span></label>
  <label class="x-chip"><input type="checkbox" name="chain" value="bitcoin" checked><span>Bitcoin</span></label>
  <label class="x-chip"><input type="checkbox" name="chain" value="midnight"><span>Midnight</span></label>
</div>
