<!-- Card grid: each card is one button (or link) plus a floating menu button. -->
<div class="x-card-grid">
  <article class="x-card">
    <button class="x-card-main" type="button" aria-label="Open Cardano Wallet">
      <span class="x-tile" aria-hidden="true">
        <svg class="x-icon" viewBox="0 0 24 24"><path d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3"/></svg>
      </span>
      <span class="x-card-text">
        <span class="x-card-title">Cardano Wallet</span>
        <span class="x-card-description">Official wallet for managing your assets.</span>
        <span class="x-card-meta">xray/cardano-wallet</span>
      </span>
    </button>
    <span class="x-card-menu">
      <button class="x-icon-button" type="button" data-size="sm" aria-label="Cardano Wallet actions">
        <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
      </button>
    </span>
  </article>

  <!-- A letter glyph and a custom strip color -->
  <article class="x-card">
    <a class="x-card-main" href="#wiki" aria-label="Open Wiki">
      <span class="x-tile" style="--x-tile-strip: var(--x-warning)" aria-hidden="true">W</span>
      <span class="x-card-text">
        <span class="x-card-title">Wiki</span>
        <span class="x-card-description">Access comprehensive documentation and resources.</span>
        <span class="x-card-meta">xray/wiki</span>
      </span>
    </a>
  </article>
</div>

<!-- Tile sizes: 64, 48 (default), 36, 20 -->
<span class="x-tile" data-size="lg" aria-hidden="true">G</span>
<span class="x-tile" aria-hidden="true">G</span>
<span class="x-tile" data-size="md" aria-hidden="true">G</span>
<span class="x-tile" data-size="xs" aria-hidden="true">G</span>
