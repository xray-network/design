<!-- Toast: the controller creates the live region and the toasts. -->
<button class="x-button" type="button" data-variant="ghost" id="copy">Copy address</button>
<button class="x-button" type="button" data-variant="ghost" id="fail">Send (fails)</button>

<script type="module">
  import { createToaster } from "./toast.controller.js";
  const { toast } = createToaster();

  document.getElementById("copy").addEventListener("click", () => toast("Address copied", { tone: "success" }));
  document.getElementById("fail").addEventListener("click", () =>
    toast("Transaction failed: fee too low", {
      tone: "danger",
      action: { label: "Retry", onClick: () => toast("Retrying with a standard fee", { tone: "info" }) },
    }),
  );
</script>
