<!-- Option cards: native radios, three across. No JS. -->
<div class="x-options" role="radiogroup" aria-label="Network fee">
  <label class="x-option">
    <input type="radio" name="fee" value="slow">
    <span class="x-option-title">Slow</span><span>About 5 min</span><span class="x-option-value">0.12 ADA</span>
  </label>
  <label class="x-option">
    <input type="radio" name="fee" value="standard" checked>
    <span class="x-option-title">Standard</span><span>About 20 s</span><span class="x-option-value">0.17 ADA</span>
  </label>
  <label class="x-option">
    <input type="radio" name="fee" value="fast">
    <span class="x-option-title">Fast</span><span>About 5 s</span><span class="x-option-value">0.42 ADA</span>
  </label>
</div>
