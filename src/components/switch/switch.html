<!-- Switch: a native checkbox with role="switch". No JS. -->
<label class="x-switch">
  <input type="checkbox" role="switch" checked>
  <span class="x-switch-track" aria-hidden="true"><span class="x-switch-thumb"></span></span>
  <span class="x-switch-label">Hide balances</span>
</label>

<!-- Settings row: label first, switch at the far end -->
<label class="x-switch" data-label="start">
  <input type="checkbox" role="switch">
  <span class="x-switch-track" aria-hidden="true"><span class="x-switch-thumb"></span></span>
  <span class="x-switch-label">Lock after 5 minutes</span>
</label>

<label class="x-switch" data-size="sm">
  <input type="checkbox" role="switch" disabled>
  <span class="x-switch-track" aria-hidden="true"><span class="x-switch-thumb"></span></span>
  <span class="x-switch-label">Testnet (unavailable)</span>
</label>
