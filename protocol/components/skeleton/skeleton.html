<!-- Skeleton: the region is busy and labelled; the placeholders are hidden from screen readers.
     A text bar is inline: put each one in the line element it stands for, so two lines stack. -->
<div aria-busy="true" aria-label="Loading payment" style="display: flex; gap: 12px; align-items: center">
  <span class="x-skeleton" data-shape="circle" aria-hidden="true" style="--x-skeleton-width: 40px"></span>
  <div style="flex: 1">
    <div><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 40%"></span></div>
    <div><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 55%"></span></div>
  </div>
</div>

<!-- Several lines of text: the last one is shorter -->
<div class="x-skeleton-text" aria-busy="true" aria-label="Loading description">
  <span class="x-skeleton" data-shape="text" aria-hidden="true"></span>
  <span class="x-skeleton" data-shape="text" aria-hidden="true"></span>
  <span class="x-skeleton" data-shape="text" aria-hidden="true"></span>
</div>

<!-- A block: a card, an image or a button -->
<span class="x-skeleton" aria-hidden="true" style="--x-skeleton-height: 120px"></span>
