<!-- Popconfirm: a Popover with a question and two buttons. Both buttons close it (popovertargetaction="hide");
     run the action from the confirm button's click handler. -->
<button class="x-button" type="button" data-variant="ghost" popovertarget="remove-app">Remove</button>
<div class="x-popover x-popconfirm" id="remove-app" popover role="alertdialog" aria-labelledby="remove-app-title" aria-describedby="remove-app-text" data-tone="danger">
  <div class="x-popconfirm-content">
    <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
    <div>
      <p class="x-popover-title" id="remove-app-title">Remove Graph from the dashboard?</p>
      <p class="x-popconfirm-description" id="remove-app-text">You can add it again from Mini Apps.</p>
    </div>
  </div>
  <div class="x-popconfirm-actions">
    <button class="x-button" type="button" data-variant="ghost" data-size="sm" popovertarget="remove-app" popovertargetaction="hide" data-autofocus="">Cancel</button>
    <button class="x-button" type="button" data-variant="danger" data-size="sm" popovertarget="remove-app" popovertargetaction="hide">Remove</button>
  </div>
</div>

<button class="x-button" type="button" data-variant="ghost" popovertarget="clear-list">Clear</button>
<div class="x-popover x-popconfirm" id="clear-list" popover role="alertdialog" aria-labelledby="clear-list-title" data-placement="bottom">
  <div class="x-popconfirm-content">
    <svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>
    <div><p class="x-popover-title" id="clear-list-title">Clear the watchlist?</p></div>
  </div>
  <div class="x-popconfirm-actions">
    <button class="x-button" type="button" data-variant="ghost" data-size="sm" popovertarget="clear-list" popovertargetaction="hide">Cancel</button>
    <button class="x-button" type="button" data-size="sm" popovertarget="clear-list" popovertargetaction="hide" data-autofocus="">Clear</button>
  </div>
</div>

<script type="module">
  import { initPopovers } from "../popover/popover.controller.js";
  initPopovers();
</script>
