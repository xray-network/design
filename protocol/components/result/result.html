<!-- Result: the mark draws once (ring, then the mark). Copy the mark paths for each status. -->
<div class="x-result" data-status="success" role="status">
  <svg class="x-result-icon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="x-result-ring" cx="50" cy="50" r="44"/>
    <path class="x-result-mark" d="M30 52 L45 67 L72 40" style="--x-result-length: 60"/>
  </svg>
  <p class="x-result-title">Account added</p>
  <p class="x-result-description">Your account is ready to use.</p>
  <div class="x-result-actions"><button class="x-button" type="button" data-shape="round">Close</button></div>
</div>

<div class="x-result" data-status="error" role="alert">
  <svg class="x-result-icon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="x-result-ring" cx="50" cy="50" r="44"/>
    <path class="x-result-mark" d="M34 34 L66 66" style="--x-result-length: 46"/>
    <path class="x-result-mark" data-step="2" d="M66 34 L34 66" style="--x-result-length: 46"/>
  </svg>
  <p class="x-result-title">Payment failed</p>
  <p class="x-result-description">The card was declined. You were not charged.</p>
  <div class="x-result-actions">
    <button class="x-button" type="button" data-variant="ghost">Close</button>
    <button class="x-button" type="button">Try again</button>
  </div>
</div>

<!-- Info: a dot, then the stem. Warning: the stem, then the dot. -->
<!-- Loading: an open ring turns until the outcome is known -->
<div class="x-result" data-status="loading" role="status" aria-busy="true">
  <svg class="x-result-icon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="x-result-ring" cx="50" cy="50" r="44"/>
  </svg>
  <p class="x-result-title">Processing payment</p>
  <p class="x-result-description">This takes a few seconds.</p>
</div>

<div class="x-result" data-status="info" data-size="sm" role="status">
  <svg class="x-result-icon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="x-result-ring" cx="50" cy="50" r="44"/>
    <path class="x-result-mark" d="M50 32 L50 33" style="--x-result-length: 1"/>
    <path class="x-result-mark" data-step="2" d="M50 46 L50 68" style="--x-result-length: 22"/>
  </svg>
  <p class="x-result-title">Nothing to claim</p>
  <p class="x-result-description">Credits appear here after a referral signs up.</p>
</div>

<div class="x-result" data-status="warning" data-size="sm" role="status">
  <svg class="x-result-icon" viewBox="0 0 100 100" aria-hidden="true">
    <circle class="x-result-ring" cx="50" cy="50" r="44"/>
    <path class="x-result-mark" d="M50 30 L50 54" style="--x-result-length: 24"/>
    <path class="x-result-mark" data-step="2" d="M50 67 L50 68" style="--x-result-length: 1"/>
  </svg>
  <p class="x-result-title">Seat limit reached</p>
</div>
