<!-- Group: parts joined into one control. data-size sets the size of every part. -->
<div class="x-group" role="group" aria-label="Website">
  <span class="x-group-addon">https://</span>
  <label class="x-input"><input aria-label="Domain" placeholder="xraynetwork" /></label>
  <span class="x-group-addon">.io</span>
</div>

<div class="x-group" role="group" aria-label="Amount" data-size="lg">
  <label class="x-input"><input aria-label="Amount" inputmode="decimal" placeholder="0.00" /></label>
  <span class="x-group-addon">USD</span>
  <button class="x-button" type="button">Max</button>
</div>

<div class="x-group" role="group" aria-label="Address" data-size="sm">
  <label class="x-input"><input aria-label="Address" value="acct_1Nv0FGQ9" readonly /></label>
  <button class="x-button" type="button" data-variant="ghost">Copy</button>
</div>

<div class="x-group" role="group" aria-label="Zoom">
  <button class="x-button" type="button" data-variant="ghost">−</button>
  <button class="x-button" type="button" data-variant="ghost">100%</button>
  <button class="x-button" type="button" data-variant="ghost">+</button>
</div>

<div class="x-group" role="group" aria-label="Actions" data-orientation="vertical">
  <button class="x-button" type="button" data-variant="ghost">Export CSV</button>
  <button class="x-button" type="button" data-variant="ghost">Export JSON</button>
</div>
