<!-- Tag: an outlined label. With a status dot it shows live state. -->
<span class="x-tag">Pro plan</span>
<span class="x-tag"><span class="x-status-dot" aria-hidden="true"></span>Live mode</span>
<span class="x-tag" data-tone="warning"><span class="x-status-dot" aria-hidden="true"></span>Syncing</span>
<span class="x-tag" data-size="sm">Read-only</span>

<!-- Filled: soft (a tint) and solid, in any color -->
<span class="x-tag" data-variant="soft">Draft</span>
<span class="x-tag" data-variant="soft" data-color="accent">Pro plan</span>
<span class="x-tag" data-variant="soft" data-color="success">Paid</span>
<span class="x-tag" data-variant="soft" data-color="warning">Due soon</span>
<span class="x-tag" data-variant="soft" data-color="danger" data-size="sm">Overdue</span>
<span class="x-tag" data-variant="solid">New</span>
<span class="x-tag" data-variant="solid" data-color="accent">Pro plan</span>
<span class="x-tag" data-variant="solid" data-color="success"><span class="x-status-dot" aria-hidden="true"></span>Live</span>
<span class="x-tag" data-variant="solid" data-color="warning">Beta</span>
<span class="x-tag" data-variant="solid" data-color="danger" data-size="sm">Failed</span>

<!-- Status: dot plus text, no outline -->
<span class="x-status"><span class="x-status-dot" aria-hidden="true"></span>Paid</span>
<span class="x-status" data-dot="end"><span class="x-status-dot" aria-hidden="true"></span>Confirmed</span>
<span class="x-status" data-tone="danger"><span class="x-status-dot" aria-hidden="true"></span>Offline</span>
<span class="x-status" data-tone="neutral"><span class="x-status-dot" aria-hidden="true"></span>Unpaid</span>

<!-- Delta: a signed change -->
<span class="x-delta" data-trend="up">+2.4%</span>
<span class="x-delta" data-trend="down">−4.1%</span>
<span class="x-delta">0.0%</span>
