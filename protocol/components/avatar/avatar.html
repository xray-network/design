<!-- Avatar, drawn ahead of time (server templates can call avatarSvg(seed, palette)). -->
<span class="x-avatar">
  <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#ffb869"/><rect width="40" height="40" fill="#fa2c37" transform="translate(-0.05 0.22) rotate(247.82 20 20)"/><rect width="40" height="40" fill="#1940ed" transform="translate(-8.72 -13.24) rotate(251.45 20 20)"/><rect width="40" height="40" fill="#ff6900" transform="translate(24.18 -11.96) rotate(488.82 20 20)"/></svg>
</span>

<!-- Drawn by avatar.controller.js from the seed; with a badge (a filled mark: verified, admin) -->
<span class="x-avatar" data-seed="billing@acme.com" data-palette="ember">
  <span class="x-avatar-badge" title="Verified">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
  </span>
</span>

<!-- Sizes: 28, 36 (default), 48 -->
<span class="x-avatar" data-size="sm" data-seed="jane@acme.com" data-palette="blue"></span>
<span class="x-avatar" data-size="lg" data-seed="ops@acme.com" data-palette="xray"></span>

<!-- Loading: a spinner on top; the avatar stays -->
<span class="x-avatar" data-seed="jane@acme.com" data-palette="blue" aria-busy="true"></span>
<script type="module">
  import { initAvatars } from "./avatar.controller.js";
  initAvatars();
</script>
