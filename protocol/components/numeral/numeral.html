<!-- Numeral: integer, small muted fraction, ticker. -->
<span class="x-numeral">
  <span class="x-numeral-value">12,480<span class="x-numeral-frac">.25</span></span>
  <span class="x-numeral-mask" aria-label="Hidden">•••••</span>
  <span class="x-numeral-ticker">USD</span>
</span>

<!-- Hero: the page's headline balance -->
<span class="x-numeral" data-size="hero">
  <span class="x-numeral-value">12,480<span class="x-numeral-frac">.25</span></span>
  <span class="x-numeral-mask" aria-label="Hidden">•••••</span>
  <span class="x-numeral-ticker">USD</span>
</span>

<!-- Small, in bars and status cards -->
<span class="x-numeral" data-size="sm">
  <span class="x-numeral-value">1,250<span class="x-numeral-frac">.00</span></span>
  <span class="x-numeral-mask" aria-label="Hidden">•••••</span>
  <span class="x-numeral-ticker">GBP</span>
</span>

<!-- Hidden balances: data-masked="true" swaps the value for the mask -->
<span class="x-numeral" data-masked="true">
  <span class="x-numeral-value">5,000<span class="x-numeral-frac">.00</span></span>
  <span class="x-numeral-mask" aria-label="Hidden">•••••</span>
  <span class="x-numeral-ticker">EUR</span>
</span>

<!-- Loading: a bar of the amount's height; the ticker stays -->
<span class="x-numeral" aria-busy="true">
  <span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 4.2em"></span>
  <span class="x-numeral-ticker">USD</span>
</span>
