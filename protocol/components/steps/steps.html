<!-- Steps: the stages of a flow. No JS: set data-state on each item and aria-current="step" on the one in progress.
     A completed step can be a button or a link that goes back to it; other steps are plain spans. -->
<ol class="x-steps" aria-label="Checkout progress">
  <li class="x-steps-item" data-state="complete">
    <button class="x-steps-trigger" type="button">
      <span class="x-steps-marker"><svg viewBox="0 0 24 24" role="img" aria-label="Completed"><path d="m4.5 12.75 6 6 9-13.5"/></svg></span>
      <span class="x-steps-title">Basket</span>
    </button>
  </li>
  <li class="x-steps-item" data-state="current" aria-current="step">
    <span class="x-steps-trigger">
      <span class="x-steps-marker">2</span>
      <span class="x-steps-title">Delivery</span>
      <span class="x-steps-description">Address and date</span>
    </span>
  </li>
  <li class="x-steps-item" data-state="upcoming">
    <span class="x-steps-trigger">
      <span class="x-steps-marker">3</span>
      <span class="x-steps-title">Payment</span>
    </span>
  </li>
</ol>

<!-- A step that is working: a spinner in the marker, aria-busy on the item. data-width="full": equal columns across
     the container (by default the row is as wide as its steps and sits at the start). -->
<ol class="x-steps" data-width="full" aria-label="Import progress">
  <li class="x-steps-item" data-state="complete">
    <span class="x-steps-trigger">
      <span class="x-steps-marker"><svg viewBox="0 0 24 24" role="img" aria-label="Completed"><path d="m4.5 12.75 6 6 9-13.5"/></svg></span>
      <span class="x-steps-title">Choose files</span>
    </span>
  </li>
  <li class="x-steps-item" data-state="loading" aria-current="step" aria-busy="true">
    <span class="x-steps-trigger">
      <span class="x-steps-marker"><span class="x-spinner" data-size="sm" aria-hidden="true"></span></span>
      <span class="x-steps-title">Upload</span>
      <span class="x-steps-description">Uploading 12 of 38</span>
    </span>
  </li>
  <li class="x-steps-item" data-state="upcoming">
    <span class="x-steps-trigger">
      <span class="x-steps-marker">3</span>
      <span class="x-steps-title">Done</span>
    </span>
  </li>
</ol>

<!-- Vertical, with a failed step -->
<ol class="x-steps" data-orientation="vertical" aria-label="Verification">
  <li class="x-steps-item" data-state="complete">
    <span class="x-steps-trigger">
      <span class="x-steps-marker"><svg viewBox="0 0 24 24" role="img" aria-label="Completed"><path d="m4.5 12.75 6 6 9-13.5"/></svg></span>
      <span class="x-steps-title">Email</span>
      <span class="x-steps-description">Confirmed on Nov 12</span>
    </span>
  </li>
  <li class="x-steps-item" data-state="error" aria-current="step">
    <span class="x-steps-trigger">
      <span class="x-steps-marker"><svg viewBox="0 0 24 24" role="img" aria-label="Failed"><path d="M6 18 18 6M6 6l12 12"/></svg></span>
      <span class="x-steps-title">Identity document</span>
      <span class="x-steps-description">The photo is blurred. Upload it again.</span>
    </span>
  </li>
  <li class="x-steps-item" data-state="upcoming">
    <span class="x-steps-trigger">
      <span class="x-steps-marker">3</span>
      <span class="x-steps-title">Address</span>
    </span>
  </li>
</ol>
