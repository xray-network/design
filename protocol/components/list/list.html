<!-- List: rows without boxes. Use div rows for static content, a/button rows for actions. -->
<div class="x-list" role="list" aria-label="Recent activity">
  <div class="x-list-heading">Today</div>
  <div class="x-list-row" role="listitem">
    <span class="x-list-icon" data-tone="positive" aria-hidden="true">
      <svg class="x-icon" viewBox="0 0 24 24"><path d="M19.5 4.5l-15 15m0 0h11.25m-11.25 0V8.25"/></svg>
    </span>
    <span class="x-list-text">
      <span class="x-list-title">Received</span>
      <span class="x-list-sub">14:02 · from Jane Cooper</span>
    </span>
    <span class="x-list-end" data-tone="positive">
      <span class="x-list-title">+$250.00</span>
      <span class="x-list-sub">$175.00</span>
    </span>
  </div>
  <a class="x-list-row" href="#tx" role="listitem">
    <span class="x-list-icon" aria-hidden="true">
      <svg class="x-icon" viewBox="0 0 24 24"><path d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/></svg>
    </span>
    <span class="x-list-text">
      <span class="x-list-title">Sent</span>
      <span class="x-list-sub">09:17 · to Acme Inc.</span>
    </span>
    <span class="x-list-end">
      <span class="x-list-title">−$42.17</span>
      <span class="x-list-sub">$29.52</span>
    </span>
  </a>
  <!-- A token disc with the asset's icon, neutral: the crypto icons carry no color of their own -->
  <div class="x-list-row" role="listitem">
    <span class="x-list-token" data-tone="neutral" aria-hidden="true"><svg class="x-icon" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(14 12 12)"><path d="M8.5 6v12m0-12h4.25a3 3 0 0 1 0 6H8.5m0 0h5a3 3 0 0 1 0 6h-5M7 6h1.5M7 18h1.5M10.5 3.75V6m3-2.25V6m-3 12v2.25m3-2.25v2.25"/></g></svg></span>
    <span class="x-list-text">
      <span class="x-list-title">Bitcoin</span>
      <span class="x-list-sub">0.1 BTC</span>
    </span>
    <span class="x-list-end">
      <span class="x-list-title">$9,641.21</span>
    </span>
  </div>
  <!-- A token disc with a letter, for an asset with no icon; a button row -->
  <button class="x-list-row" type="button" role="listitem">
    <span class="x-list-token" style="--x-list-token-bg: var(--x-warning)" aria-hidden="true">S</span>
    <span class="x-list-text">
      <span class="x-list-title">Snek</span>
      <span class="x-list-sub">5,000.00 EUR</span>
    </span>
    <span class="x-list-end">
      <span class="x-list-title">$461.82</span>
    </span>
  </button>
</div>

<!-- Text only: no lead and no end; the row is its title, with an optional line under it -->
<div class="x-list" role="list" aria-label="Documents">
  <a class="x-list-row" href="/release-notes" role="listitem">
    <span class="x-list-text"><span class="x-list-title">Release notes</span><span class="x-list-sub">What changed in 1.0.0</span></span>
  </a>
  <a class="x-list-row" href="/terms" role="listitem">
    <span class="x-list-text"><span class="x-list-title">Terms of service</span></span>
  </a>
</div>

<!-- Loading -->

  </div>
</div>
