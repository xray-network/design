<!-- Message: the controller creates the top-right region and the messages. -->
<button class="x-button" type="button" data-variant="ghost" id="delegated">Delegate</button>
<button class="x-button" type="button" data-variant="ghost" id="saturated">Pool warning</button>
<button class="x-button" type="button" data-variant="ghost" id="update">Plain message</button>

<script type="module">
  import { createMessenger } from "./message.controller.js";
  const { message } = createMessenger();

  document.getElementById("delegated").addEventListener("click", () =>
    message({ tone: "success", title: "Delegation confirmed", text: "The first reward arrives in about 15 days." }),
  );
  document.getElementById("saturated").addEventListener("click", () =>
    message({
      tone: "warning",
      title: "Pool saturated",
      text: "XRAY Stake Pool is at 101% saturation, so rewards are reduced.",
      action: { label: "Change pool", onClick: () => message({ tone: "info", text: "Choose a pool in Staking." }) },
      duration: Infinity,
    }),
  );
  document.getElementById("update").addEventListener("click", () =>
    message({ title: "Wallet synced", text: "Balances are up to date." }),
  );
</script>
