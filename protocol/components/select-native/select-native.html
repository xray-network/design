<!-- Select Native: the platform's own select in the input's frame. Name it with a label. -->
<label class="x-field-label" for="region">Region</label>
<div class="x-select-native">
  <select id="region" name="region">
    <option value="us-east">US East</option>
    <option value="eu-west">EU West</option>
    <option value="ap-south" disabled>Asia Pacific</option>
  </select>
  <svg class="x-select-native-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
</div>

<div class="x-select-native" data-size="sm">
  <select aria-label="Sort by"><option>Value</option><option>Name</option><option>Change 24h</option></select>
  <svg class="x-select-native-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
</div>

<div class="x-select-native" data-size="lg">
  <select aria-label="Currency" aria-invalid="true"><option>USD</option><option>EUR</option></select>
  <svg class="x-select-native-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
</div>
