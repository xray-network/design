<!-- Segmented: native radios, so it works and submits without JS.
     segmented.controller.js adds the liquid indicator. -->
<div class="x-segmented" role="radiogroup" aria-label="Period">
  <label class="x-segmented-item"><input type="radio" name="period" value="24h" checked><span>24h</span></label>
  <label class="x-segmented-item"><input type="radio" name="period" value="7d"><span>7 days</span></label>
  <label class="x-segmented-item"><input type="radio" name="period" value="30d"><span>30 days</span></label>
  <label class="x-segmented-item"><input type="radio" name="period" value="all"><span>All time</span></label>
  <span class="x-segmented-indicator" aria-hidden="true"></span>
</div>

<!-- Small, with counts -->
<div class="x-segmented" data-size="sm" role="radiogroup" aria-label="Assets">
  <label class="x-segmented-item"><input type="radio" name="assets" value="tokens" checked><span>Tokens<i>6</i></span></label>
  <label class="x-segmented-item"><input type="radio" name="assets" value="nfts"><span>NFTs<i>12</i></span></label>
  <span class="x-segmented-indicator" aria-hidden="true"></span>
</div>

<!-- Full width: items share the width equally (payment panes) -->
<div class="x-segmented" data-width="full" role="radiogroup" aria-label="Payment action">
  <label class="x-segmented-item"><input type="radio" name="payment" value="send" checked><span>Send</span></label>
  <label class="x-segmented-item"><input type="radio" name="payment" value="request"><span>Request</span></label>
  <label class="x-segmented-item"><input type="radio" name="payment" value="schedule"><span>Schedule</span></label>
  <label class="x-segmented-item"><input type="radio" name="payment" value="split" disabled><span>Split</span></label>
  <span class="x-segmented-indicator" aria-hidden="true"></span>
</div>

<!-- With views: panels right after the control, matched by data-value; lazy content in <template data-lazy>. -->
<div class="x-segmented" role="radiogroup" aria-label="Chart">
  <label class="x-segmented-item" id="chart-balance"><input type="radio" name="chart" value="balance" checked><span>Balance</span></label>
  <label class="x-segmented-item" id="chart-rewards"><input type="radio" name="chart" value="rewards"><span>Rewards</span></label>
  <span class="x-segmented-indicator" aria-hidden="true"></span>
</div>
<div class="x-segmented-panels">
  <section class="x-segmented-panel" data-value="balance" aria-labelledby="chart-balance"><p>Balance over 30 days.</p></section>
  <section class="x-segmented-panel" data-value="rewards" aria-labelledby="chart-rewards" hidden>
    <template data-lazy><p>Refunds per week.</p></template>
  </section>
</div>

<script type="module">
  import { initSegmented } from "./segmented.controller.js";
  initSegmented();
</script>
