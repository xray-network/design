<!-- Progress: a task with a known length. Set --x-progress-value (0 to 1) and aria-valuenow together. No JS. -->
<div class="x-progress" role="progressbar" aria-labelledby="upload-label" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="--x-progress-value: 0.64">
  <div class="x-progress-head">
    <span class="x-progress-label" id="upload-label">Uploading statement.pdf</span>
    <span class="x-progress-value">64%</span>
  </div>
  <div class="x-progress-track"><div class="x-progress-fill"></div></div>
</div>

<!-- Small, no head: name it with aria-label -->
<div class="x-progress" role="progressbar" data-size="sm" data-tone="success" aria-label="Sync" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="--x-progress-value: 1">
  <div class="x-progress-track"><div class="x-progress-fill"></div></div>
</div>

<!-- Meter: a reading, colored by level (set data-tone from your thresholds) -->
<div class="x-progress" role="meter" data-tone="warning" aria-labelledby="storage-label" aria-valuenow="4.1" aria-valuemin="0" aria-valuemax="5" aria-valuetext="4.1 of 5 GB" style="--x-progress-value: 0.82">
  <div class="x-progress-head">
    <span class="x-progress-label" id="storage-label">Storage</span>
    <span class="x-progress-value">4.1 of 5 GB</span>
  </div>
  <div class="x-progress-track"><div class="x-progress-fill"></div></div>
</div>
<div class="x-progress" role="meter" data-tone="danger" aria-label="Daily limit" aria-valuenow="1020" aria-valuemin="0" aria-valuemax="1000" style="--x-progress-value: 1">
  <div class="x-progress-track"><div class="x-progress-fill"></div></div>
</div>
<div class="x-progress" role="meter" data-tone="neutral" aria-label="Seats" aria-valuenow="3" aria-valuemin="0" aria-valuemax="10" style="--x-progress-value: 0.3">
  <div class="x-progress-track"><div class="x-progress-fill"></div></div>
</div>
