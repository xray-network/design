<!-- Checkbox: native inputs. No JS (indeterminate has no HTML attribute: set it from JS). -->
<fieldset class="x-checkbox-group">
  <legend>Notifications</legend>
  <label class="x-checkbox">
    <input type="checkbox" name="notify" value="received" checked>
    <span class="x-checkbox-text">Incoming funds<span class="x-checkbox-description">When an address of yours receives funds</span></span>
  </label>
  <label class="x-checkbox">
    <input type="checkbox" name="notify" value="rewards">
    <span class="x-checkbox-text">Refunds</span>
  </label>
  <label class="x-checkbox">
    <input type="checkbox" name="notify" value="updates" disabled>
    <span class="x-checkbox-text">Product updates</span>
  </label>
</fieldset>
