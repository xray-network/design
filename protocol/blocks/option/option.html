<!-- Option cards: native radios, three across. No JS. -->
<div class="x-options" role="radiogroup" aria-label="Payout speed">
  <label class="x-option">
    <input type="radio" name="fee" value="slow">
    <span class="x-option-title">Standard</span><span>2–3 business days</span><span class="x-option-value">Free</span>
  </label>
  <label class="x-option">
    <input type="radio" name="fee" value="standard" checked>
    <span class="x-option-title">Same day</span><span>Before 6 pm</span><span class="x-option-value">$1.00</span>
  </label>
  <label class="x-option">
    <input type="radio" name="fee" value="fast">
    <span class="x-option-title">Instant</span><span>In seconds</span><span class="x-option-value">$2.50</span>
  </label>
</div>

<!-- Loading -->
<div class="x-options" role="radiogroup" aria-label="Payout speed" aria-busy="true">
  <label class="x-option"><input type="radio" name="speed-loading" value="slow" disabled>
    <span class="x-option-title"><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 48%"></span></span><span><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 72%"></span></span><span class="x-option-value"><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 30%"></span></span>
  </label>
</div>
