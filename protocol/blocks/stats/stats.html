<!-- Stats: key figures in a grid. --x-stats-columns sets the columns on wide screens (default 4); phones show 2. -->
<dl class="x-stats" style="--x-stats-columns: 3">
  <div class="x-stat">
    <dt class="x-stat-label">Received</dt>
    <dd class="x-stat-value" data-tone="positive">+337.90</dd>
    <dd class="x-stat-sub">ADA, last 14 days</dd>
  </div>
  <div class="x-stat">
    <dt class="x-stat-label">Sent</dt>
    <dd class="x-stat-value">−1,045.38</dd>
    <dd class="x-stat-sub">ADA, last 14 days</dd>
  </div>
  <div class="x-stat">
    <dt class="x-stat-label">Transactions</dt>
    <dd class="x-stat-value">38</dd>
    <dd class="x-stat-sub">0.51 ADA in fees</dd>
  </div>
</dl>

<!-- With changes. The tone says whether a change is good: latency going down is positive. -->
<dl class="x-stats">
  <div class="x-stat">
    <dt class="x-stat-label">Requests, 24h</dt>
    <dd class="x-stat-value">1.28M</dd>
    <dd class="x-stat-delta" data-tone="positive">↑ 6.2%</dd>
  </div>
  <div class="x-stat">
    <dt class="x-stat-label">Latency, p95</dt>
    <dd class="x-stat-value">84 ms</dd>
    <dd class="x-stat-delta" data-tone="positive">↓ 3.1%</dd>
  </div>
  <div class="x-stat">
    <dt class="x-stat-label">Error rate</dt>
    <dd class="x-stat-value">0.02%</dd>
    <dd class="x-stat-delta" data-tone="positive">↓ 0.01 pts</dd>
  </div>
  <div class="x-stat">
    <dt class="x-stat-label">Uptime, 30d</dt>
    <dd class="x-stat-value">99.98%</dd>
    <dd class="x-stat-sub">No incidents</dd>
  </div>
</dl>
