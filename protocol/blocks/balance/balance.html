<!-- Balance: Numeral (hero), fiat value, Delta, and the main actions. -->
<section class="x-balance" aria-label="Total balance">
  <div class="x-balance-label">Total balance</div>
  <span class="x-numeral" data-size="hero">
    <span class="x-numeral-value">12,480<span class="x-numeral-frac">.254221</span></span>
    <span class="x-numeral-mask" aria-label="Hidden">•••••</span>
    <span class="x-numeral-ticker">USD</span>
  </span>
  <div class="x-balance-meta">
    <span>$8,736.18 USD</span>
    <span class="x-delta" data-trend="up">+2.4%</span>
    <span class="x-balance-period">today</span>
  </div>
  <div class="x-balance-actions">
    <button class="x-button" type="button">Send</button>
    <button class="x-button" type="button" data-variant="ghost">Receive</button>
    <button class="x-button" type="button" data-variant="ghost">Add funds</button>
  </div>
</section>

<!-- Loading -->
<section class="x-balance" aria-label="Total balance" aria-busy="true">
  <div class="x-balance-label">Total balance</div>
  <span class="x-numeral" data-size="hero" aria-busy="true"><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 4.2em"></span><span class="x-numeral-ticker">USD</span></span>
  <div class="x-balance-meta"><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 11em"></span></div>
</section>
