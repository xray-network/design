<!-- SendForm: Field, CardOption and Button. send-form.controller.js adds Max, the live total and the
     over-balance error; without it the form still submits. -->
<form class="x-send-form" data-available="12480.254221" data-ticker="USD">
  <div class="x-field">
    <label class="x-field-label" for="send-to">Recipient</label>
    <div class="x-input x-send-form-address">
      <input id="send-to" name="to" type="text" placeholder="Email or account ID" autocomplete="off" spellcheck="false" required>
    </div>
  </div>

  <div class="x-field">
    <label class="x-field-label" for="send-amount">Amount</label>
    <div class="x-input" data-size="lg">
      <input id="send-amount" name="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" required data-x-amount aria-describedby="send-amount-hint">
      <button class="x-button" type="button" data-variant="chip" data-x-max>Max</button>
      <span class="x-input-affix">USD</span>
    </div>
    <p class="x-field-hint" id="send-amount-hint">12,480.25 USD available</p>
  </div>

  <div class="x-field">
    <span class="x-field-label" id="send-fee-label">Fee</span>
    <div class="x-options" role="radiogroup" aria-labelledby="send-fee-label">
      <label class="x-option">
        <input type="radio" name="fee" value="slow" data-fee="0.12">
        <span class="x-option-title">Standard</span><span>2–3 business days</span><span class="x-option-value">Free</span>
      </label>
      <label class="x-option">
        <input type="radio" name="fee" value="standard" data-fee="0.17" checked>
        <span class="x-option-title">Same day</span><span>Before 6 pm</span><span class="x-option-value">$1.00</span>
      </label>
      <label class="x-option">
        <input type="radio" name="fee" value="fast" data-fee="0.42">
        <span class="x-option-title">Instant</span><span>In seconds</span><span class="x-option-value">$2.50</span>
      </label>
    </div>
  </div>

  <dl class="x-send-form-summary">
    <div><dt>Fee</dt><dd data-x-fee>1.00 USD</dd></div>
    <div><dt>Total</dt><dd><b data-x-total>1.00 USD</b></dd></div>
  </dl>

  <button class="x-button" type="submit" data-size="lg" data-width="full">Review transaction</button>
</form>

<!-- Loading: the balance and fees as placeholders; the submit button is disabled -->
<form class="x-send-form" aria-busy="true">
  <dl class="x-send-form-summary">
    <div><dt>Fee</dt><dd><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 4.5em"></span></dd></div>
    <div><dt>Total</dt><dd><span class="x-skeleton" data-shape="text" aria-hidden="true" style="--x-skeleton-width: 5.5em"></span></dd></div>
  </dl>
  <button class="x-button" type="submit" data-size="lg" data-width="full" disabled>Review payment</button>
</form>
<script type="module">
  import { initSendForms } from "./send-form.controller.js";
  initSendForms();
</script>
