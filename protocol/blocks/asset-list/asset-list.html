<!-- AssetList: List and the Tag component's delta. No JS. --x-asset-list-share is the asset's share of the whole, 0 to 1. -->
<div class="x-list x-asset-list" role="list" aria-label="Assets">
  <a class="x-list-row" role="listitem" href="#btc">
    <span class="x-list-token" aria-hidden="true">B</span>
    <span class="x-list-text"><span class="x-list-title">Bitcoin</span><span class="x-list-sub">0.1 BTC</span></span>
    <span class="x-list-end"><span class="x-list-title">$9,641.21</span><span class="x-list-sub"><span class="x-delta" data-trend="up">+1.8%</span></span></span>
    <span class="x-asset-list-share" style="--x-asset-list-share: 0.6" aria-hidden="true"></span>
  </a>
  <a class="x-list-row" role="listitem" href="#eth">
    <span class="x-list-token" aria-hidden="true">E</span>
    <span class="x-list-text"><span class="x-list-title">Ether</span><span class="x-list-sub">1.5 ETH</span></span>
    <span class="x-list-end"><span class="x-list-title">$4,812.60</span><span class="x-list-sub"><span class="x-delta" data-trend="down">−0.9%</span></span></span>
    <span class="x-asset-list-share" style="--x-asset-list-share: 0.3" aria-hidden="true"></span>
  </a>
  <button class="x-list-row" role="listitem" type="button">
    <span class="x-list-token" aria-hidden="true">U</span>
    <span class="x-list-text"><span class="x-list-title">USD Coin</span><span class="x-list-sub">1,200 USDC</span></span>
    <span class="x-list-end"><span class="x-list-title">$1,200.00</span><span class="x-list-sub"><span class="x-delta">0.0%</span></span></span>
  </button>
</div>
