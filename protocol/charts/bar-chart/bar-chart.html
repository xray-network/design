<!-- Bar chart: bar-chart.controller.js draws the table as columns, one per series in each category. The table is
     the data and the accessible view. Needs core/chart.css as well as its own. -->
<figure class="x-chart x-bar-chart">
  <figcaption class="x-chart-title">Payouts and refunds</figcaption>
  <table class="x-chart-data">
    <thead><tr><th scope="col">Month</th><th scope="col">Payouts</th><th scope="col">Refunds</th></tr></thead>
    <tbody>
      <tr><th scope="row">Jan</th><td data-value="18200">18,200</td><td data-value="1200">1,200</td></tr>
      <tr><th scope="row">Feb</th><td data-value="21400">21,400</td><td data-value="900">900</td></tr>
