<!-- Donut chart: donut-chart.controller.js draws the first column of amounts as the parts of one whole, with the
     total in the middle. The table is the data and the accessible view. Needs core/chart.css as well as its own. -->
<figure class="x-chart x-donut-chart" data-total="Portfolio">
  <figcaption class="x-chart-title">Holdings</figcaption>
  <table class="x-chart-data">
    <thead><tr><th scope="col">Asset</th><th scope="col">Value</th></tr></thead>
    <tbody>
      <tr><th scope="row">Ether</th><td data-value="4812">4,812</td></tr>
      <tr><th scope="row">Wrapped Bitcoin</th><td data-value="9640">9,640</td></tr>
      <tr><th scope="row">USD Coin</th><td data-value="1200">1,200</td></tr>
      <tr><th scope="row">Chainlink</th><td data-value="318">318</td></tr>
    </tbody>
  </table>
</figure>

<!-- Smaller, with the table shown in place of the plot -->
<figure class="x-chart x-donut-chart" data-height="140" data-view="table" aria-label="Payment methods">
  <table class="x-chart-data">
    <thead><tr><th scope="col">Method</th><th scope="col">Share</th></tr></thead>
    <tbody>
      <tr><th scope="row">Card</th><td data-value="62">62</td></tr>
      <tr><th scope="row">Bank transfer</th><td data-value="27">27</td></tr>
      <tr><th scope="row">Wallet</th><td data-value="11">11</td></tr>
    </tbody>
  </table>
</figure>

<script type="module">
  import { initDonutCharts } from "./donut-chart.controller.js";
  initDonutCharts();
</script>
